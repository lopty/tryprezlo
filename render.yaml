# Render Static Site. Add the repository through a Blueprint or use these settings.
# Existing Render services retain routing rules omitted from this file: remove any
# old /* -> /index.html SPA fallback in the dashboard before deploying this build.
services:
  - type: web
    name: tryprezlo
    runtime: static
    buildCommand: npm ci --include=dev && npm run typecheck && npm run build && npm run check:seo
    staticPublishPath: ./dist
    domains:
      - tryprezlo.com
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /404.html
        name: X-Robots-Tag
        value: noindex
    # Deliberately no catch-all SPA rewrite. Unknown pages must return 404.
    routes:
      - type: redirect
        source: /home
        destination: /
      # Generated clean-route mappings: run npm run config:render after route changes.
      - type: redirect
        source: /platform/
        destination: /platform
      - type: rewrite
        source: /platform
        destination: /platform/index.html
      - type: redirect
        source: /for-agencies/
        destination: /for-agencies
      - type: rewrite
        source: /for-agencies
        destination: /for-agencies/index.html
      - type: redirect
        source: /for-brands/
